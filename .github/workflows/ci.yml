name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Offline backend tests
        run: ./scripts/test.sh
      - name: Build native app
        run: ./build-app.sh
      - name: Check panel layout
        run: build/MacVPN.app/Contents/MacOS/MacVPN --check-layout
      - name: Verify bundle signature
        run: codesign --verify --strict build/MacVPN.app
